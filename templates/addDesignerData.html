<html>

<head>

<title>Add Game Designer</title>
<style>
body {background-color:tan;}
h1 {color:sienna;margin:auto;text-align:center;font-size:60px;}
form {max-width:fit-content;margin:auto;text-align:center; background-color:white; outline:5px solid sienna;padding:10px;}
input, select {margin:5px;}
.top {float:right; margin-top:0; margin-right:25px;}
a:link, a:visited { /*from w3schools template*/ 
      background-color: white;color: black;border: 2px solid brown;padding: 10px 20px; text-align: center;text-decoration: none;display:inline-block;width:fit-content;}
a:hover, a:active {background-color: brown;color: white;}
</style>
</head>

<body>
<a class="top" href="{{url_for('index')}}">Back</a>
<h1>Add Game Designer</h1>
<br><br>
<form method="get" action="{{url_for('commit_designer_data')}}">

<label for="name">Name:</label>
<input type="text" name="name" maxlength=100 required/><br>

<label for="birthYear">Birth Year:</label>
<input type="number" name="birthYear" step=1 min=1 /><br>

<label for="country">Country of Origin:</label>
<input type="text" name="country" maxlength=100 required/><br>

<input type="submit" value="Add"/>
</form>
</body>

</html>
